<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chaos Queens Roulette V4</title>
<style>
body{
margin:0;
background: radial-gradient(circle,#2b004f,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
color:#ff4da6;
margin-top:20px;
text-shadow:0 0 20px #ff2e88;
animation: glowTitle 2s infinite alternate;
}

@keyframes glowTitle{
from{ text-shadow:0 0 10px #ff2e88;}
to{ text-shadow:0 0 30px #ff2e88;}
}

#wrapper{
position:relative;
width:360px;
margin:20px auto;
animation: float 4s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

#pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:40px;
text-shadow:0 0 15px white;
}

canvas{
width:360px;
height:360px;
border-radius:50%;
box-shadow:0 0 30px #ff2e88;
transition: transform 0.3s;
}

button{
padding:15px 25px;
margin-top:10px;
border:none;
border-radius:12px;
background:#ff2e88;
color:white;
font-size:16px;
box-shadow:0 0 15px #ff2e88;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 25px #ff2e88;
}

#result{
margin-top:15px;
font-size:26px;
font-weight:bold;
opacity:0;
transform:scale(0.8);
transition:0.4s;
}

.show{
opacity:1 !important;
transform:scale(1.2) !important;
}

.flash{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:white;
opacity:0;
pointer-events:none;
transition:0.2s;
}
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<h1>⚡️💓 CHAOS QUEENS 💓⚡️</h1>

<div id="wrapper">
<div id="pointer">🔻</div>
<canvas id="wheel" width="360" height="360"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<button onclick="chaosMode()">💀 CHAOS FINAL</button>

<div id="result">Résultat : ?</div>
<iframe id="musicPlayer" width="0" height="0" frameborder="0" allow="autoplay"></iframe>

<script>
let playlist = [
"https://www.youtube.com/embed/gAaN9WUO75Q",
"https://www.youtube.com/embed/dgPauIRYNUw",
"https://www.youtube.com/embed/IR4ujMOgxA4",
"https://www.youtube.com/embed/B7hy6bTdrVQ",
"https://www.youtube.com/embed/waU75jdUnYw",
"https://www.youtube.com/embed/oqv35UZepIM",
"https://www.youtube.com/embed/pfxyk1glEq4",
"https://www.youtube.com/embed/kaoYLN4mOxg",
"https://www.youtube.com/embed/HL1UzIK-flA",
"https://www.youtube.com/embed/TSsFB241BHs",
"https://www.youtube.com/embed/3tA6KH07u_Y",
"https://www.youtube.com/embed/1zbfwEA8Xf0"
];

let audioUnlocked = false;
let angle = 0;

let items = [
"Drague","Drama","Spicy","Imitation",
"Jalousie","Compliment","Mini drama","Sujet gênant"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function drawWheel(){
let arc = (2*Math.PI)/items.length;
ctx.clearRect(0,0,360,360);

for(let i=0;i<items.length;i++){
ctx.beginPath();
ctx.fillStyle = i%2 ? "#ff2e88" : "#660033";
ctx.moveTo(180,180);
ctx.arc(180,180,180,i*arc,(i+1)*arc);
ctx.fill();

ctx.fillStyle="white";
ctx.font="14px Arial";
ctx.save();
ctx.translate(180,180);
ctx.rotate(i*arc+arc/2);
ctx.fillText(items[i],90,0);
ctx.restore();
}
}
drawWheel();

function playRandomMusic(){
let player = document.getElementById("musicPlayer");
let randomIndex = Math.floor(Math.random() * playlist.length);
let video = playlist[randomIndex];
let id = video.split("/").pop();
player.src = video + "?autoplay=1&mute=0&loop=1&playlist=" + id;
}

function spin(){

// 🔓 Débloque son iPhone au premier clic
if(!audioUnlocked){
let player = document.getElementById("musicPlayer");
player.src = playlist[0] + "?autoplay=1";
audioUnlocked = true;
}

// 🎵 musique aléatoire
playRandomMusic();

let spinAngle = Math.random()*2000+2000;
let duration = 3000;
let start = null;

function animate(t){
if(!start) start = t;

let progress = t - start;
let ease = spinAngle*(1-progress/duration);

// ralentissement progressif
angle += ease * 0.0005;

ctx.save();
ctx.translate(180,180);
ctx.rotate(angle);
ctx.translate(-180,-180);
drawWheel();
ctx.restore();

if(progress < duration){
requestAnimationFrame(animate);
}else{
showResult();
}
}

requestAnimationFrame(animate);
}

function showResult(){
let arc = (2*Math.PI)/items.length;

// 🔥 correction parfaite de la flèche
let index = Math.floor(((-angle + Math.PI/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) / arc);

let res = items[index];
document.getElementById("result").innerText = "🔥 " + res;

// 💥 flash
let flash = document.getElementById("flash");
flash.style.opacity = 0.8;
setTimeout(()=>flash.style.opacity=0,200);

// 🗣️ voix
let msg = new SpeechSynthesisUtterance(res);
msg.lang="fr-FR";
speechSynthesis.speak(msg);
}

function chaosMode(){
items.push("💀 ULTIME CHAOS");
drawWheel();
alert("💀 MODE CHAOS ACTIVÉ");
}
</script>

</body>
</html>
