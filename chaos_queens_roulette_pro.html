<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>La Mafia Roulette 💓⚡️</title>

<style>
body{
margin:0;
background: radial-gradient(circle,#1a001f,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

/* 💓 titre */
h1{
color:#ff4da6;
margin-top:20px;
font-size:28px;
text-shadow:0 0 20px #ff2e88,0 0 40px #ff2e88;
}

/* 🔻 flèche FIXE */
#pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:55px;
color:#ff2e88;
text-shadow:0 0 20px #ff2e88,0 0 50px #ff2e88;
z-index:9999;
}

/* 🎡 wrapper */
#wrapper{
position:relative;
width:420px;
margin:80px auto;
}

/* 🎡 roue */
canvas{
width:420px;
height:420px;
border-radius:50%;
box-shadow:0 0 50px #ff2e88;
}

/* 🎯 résultat */
#result{
margin-top:20px;
font-size:26px;
font-weight:bold;
color:#ff4da6;
text-shadow:0 0 15px #ff2e88;
opacity:0;
transition:0.3s;
}

/* bouton */
button{
padding:15px 30px;
margin-top:20px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#ff2e88,#9900ff);
color:white;
font-size:18px;
box-shadow:0 0 25px #ff2e88;
}
</style>
</head>

<body>

<h1>💓⚡️ LA MAFIA ROULETTE ⚡️💓</h1>

<div id="pointer">🔻</div>

<div id="wrapper">
<canvas id="wheel" width="420" height="420"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<div id="result"></div>

<audio id="musicPlayer"></audio>

<script>

// 🎵 playlist
let playlist = [
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Twinsizz%20-%20Gr%C3%A9goire.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Sage%20-%20Opa.mp3"
];

let audioUnlocked=false;
let lastPlayed=-1;
let angle=0;

// 💓 couleurs mafia (pas arc-en-ciel)
let items=[
{text:"Drague",color:"#ff2e88"},
{text:"Drama",color:"#ff0033"},
{text:"Spicy",color:"#ff1a75"},
{text:"Imitation",color:"#9900ff"},
{text:"Jalousie",color:"#cc0066"},
{text:"Compliment",color:"#ff66b2"},
{text:"Mini drama",color:"#e60073"},
{text:"Sujet gênant",color:"#660033"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function drawWheel(){
let arc=(2*Math.PI)/items.length;
ctx.clearRect(0,0,420,420);

for(let i=0;i<items.length;i++){

ctx.beginPath();
ctx.fillStyle=items[i].color;
ctx.moveTo(210,210);
ctx.arc(210,210,210,i*arc,(i+1)*arc);
ctx.fill();

// glow
ctx.shadowColor=items[i].color;
ctx.shadowBlur=20;
ctx.fill();

// texte
ctx.shadowBlur=0;
ctx.fillStyle="white";
ctx.font="bold 15px Arial";

ctx.save();
ctx.translate(210,210);
ctx.rotate(i*arc+arc/2);
ctx.fillText(items[i].text,120,0);
ctx.restore();
}
}
drawWheel();

function playRandomMusic(){
let player=document.getElementById("musicPlayer");

let randomIndex;
do{
randomIndex=Math.floor(Math.random()*playlist.length);
}while(randomIndex===lastPlayed);

lastPlayed=randomIndex;

player.pause();
player.currentTime=0;
player.src=playlist[randomIndex];

setTimeout(()=>player.play().catch(()=>{}),100);
}

function spin(){

let player=document.getElementById("musicPlayer");

if(!audioUnlocked){
player.src=playlist[0];
player.play().catch(()=>{});
audioUnlocked=true;
}

playRandomMusic();

let spinAngle=Math.random()*2000+2000;
let duration=3000;
let start=null;

function animate(t){
if(!start) start=t;

let progress=t-start;
let ease=spinAngle*(1-progress/duration);

angle+=ease*0.0006;

ctx.save();
ctx.translate(210,210);
ctx.rotate(angle);
ctx.translate(-210,-210);
drawWheel();
ctx.restore();

if(progress<duration){
requestAnimationFrame(animate);
}else{
showResult();
}
}

requestAnimationFrame(animate);
}

function showResult(){

let arc=(2*Math.PI)/items.length;

// 🎯 calcul correct
let index=Math.floor(
((Math.PI/2 - angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)/arc
);

let result=items[index].text;

let resultDiv=document.getElementById("result");
resultDiv.innerText="🔥 "+result;
resultDiv.style.opacity="1";

// petit effet
setTimeout(()=>{
resultDiv.style.opacity="0";
},2500);
}

</script>

</body>
</html>
