<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chaos Queens 💋</title>

<style>
body{
margin:0;
background: radial-gradient(circle,#0d0010,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
color:#ff4da6;
margin-top:20px;
text-shadow:0 0 20px #ff2e88,0 0 40px #ff2e88;
}

/* 🔻 flèche FIXE */
#pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:60px;
color:#ff2e88;
text-shadow:0 0 20px #ff2e88,0 0 60px #ff2e88;
z-index:9999;
}

#wrapper{
position:relative;
width:420px;
margin:80px auto;
}

canvas{
width:420px;
height:420px;
border-radius:50%;
box-shadow:0 0 60px #ff2e88;
}

button{
padding:15px 30px;
margin-top:20px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#ff2e88,#ff0055);
color:white;
font-size:18px;
box-shadow:0 0 30px #ff2e88;
}
</style>
</head>

<body>

<h1>💋 CHAOS QUEENS 💋</h1>

<div id="pointer">🔻</div>

<div id="wrapper">
<canvas id="wheel" width="420" height="420"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<audio id="musicPlayer"></audio>

<script>

let playlist = [
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Twinsizz%20-%20Gr%C3%A9goire.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Sage%20-%20Opa.mp3"
];

let audioUnlocked=false;
let lastPlayed=-1;
let angle=0;

// 🌈 couleurs néon
let items=[
{text:"Drague",color:"#ff4da6"},
{text:"Drama",color:"#ff0033"},
{text:"Spicy",color:"#ff6600"},
{text:"Imitation",color:"#9933ff"},
{text:"Jalousie",color:"#00ff99"},
{text:"Compliment",color:"#ffd699"},
{text:"Mini drama",color:"#ff66cc"},
{text:"Sujet gênant",color:"#111111"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function drawWheel(){
let arc=(2*Math.PI)/items.length;
ctx.clearRect(0,0,420,420);

for(let i=0;i<items.length;i++){

// 🎨 case
ctx.beginPath();
ctx.fillStyle=items[i].color;
ctx.moveTo(210,210);
ctx.arc(210,210,210,i*arc,(i+1)*arc);
ctx.fill();

// ✨ effet néon glow
ctx.shadowColor = items[i].color;
ctx.shadowBlur = 25;
ctx.fill();

// 📝 texte néon
ctx.shadowBlur = 15;
ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.save();
ctx.translate(210,210);
ctx.rotate(i*arc+arc/2);
ctx.fillText(items[i].text,120,0);
ctx.restore();

// reset shadow
ctx.shadowBlur = 0;
}
}
drawWheel();

function playRandomMusic(){
let player=document.getElementById("musicPlayer");

let randomIndex;
do{
randomIndex=Math.floor(Math.random()*playlist.length);
}while(randomIndex===lastPlayed);

lastPlayed=randomIndex;

player.pause();
player.currentTime=0;
player.src=playlist[randomIndex];

setTimeout(()=>player.play().catch(()=>{}),100);
}

function spin(){

let player=document.getElementById("musicPlayer");

if(!audioUnlocked){
player.src=playlist[0];
player.play().catch(()=>{});
audioUnlocked=true;
}

playRandomMusic();

let spinAngle=Math.random()*2000+2000;
let duration=3000;
let start=null;

function animate(t){
if(!start) start=t;

let progress=t-start;
let ease=spinAngle*(1-progress/duration);

angle+=ease*0.0006;

ctx.save();
ctx.translate(210,210);
ctx.rotate(angle);
ctx.translate(-210,-210);
drawWheel();
ctx.restore();

if(progress<duration){
requestAnimationFrame(animate);
}
}

requestAnimationFrame(animate);
}

</script>

</body>
</html>
