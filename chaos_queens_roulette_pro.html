<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chaos Queens Roulette 🔥</title>

<style>
body{
margin:0;
background: radial-gradient(circle,#2b004f,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
transition:0.3s;
}

h1{
color:#ff4da6;
margin-top:20px;
text-shadow:0 0 25px #ff2e88;
animation: glowTitle 2s infinite alternate;
}

@keyframes glowTitle{
from{ text-shadow:0 0 10px #ff2e88;}
to{ text-shadow:0 0 40px #ff2e88;}
}

#wrapper{
position:relative;
width:360px;
margin:20px auto;
}

/* 🔥 FEU AUTOUR */
#wrapper::before{
content:"";
position:absolute;
top:-15px;
left:-15px;
width:390px;
height:390px;
border-radius:50%;
background: conic-gradient(#ff0000,#ff7300,#fffb00,#ff7300,#ff0000);
filter: blur(25px);
z-index:-1;
animation: fireSpin 3s linear infinite;
opacity:0.7;
}

@keyframes fireSpin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

#pointer{
position:absolute;
top:-10px;
left:50%;
transform:translateX(-50%);
font-size:40px;
text-shadow:0 0 15px white;
}

canvas{
width:360px;
height:360px;
border-radius:50%;
box-shadow:0 0 40px #ff2e88;
transition: transform 0.3s;
}

button{
padding:15px 25px;
margin-top:10px;
border:none;
border-radius:12px;
background:#ff2e88;
color:white;
font-size:16px;
box-shadow:0 0 20px #ff2e88;
}

#result{
margin-top:15px;
font-size:28px;
font-weight:bold;
opacity:0;
transform:scale(0.8);
transition:0.4s;
}

.flash{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:white;
opacity:0;
pointer-events:none;
transition:0.3s;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<h1>⚡️💓 CHAOS QUEENS 💓⚡️</h1>

<div id="wrapper">
<div id="pointer">🔻</div>
<canvas id="wheel" width="360" height="360"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<div id="result"></div>

<audio id="musicPlayer"></audio>

<script>

// 🎵 TES MUSIQUES
let playlist = [
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Twinsizz%20-%20Gr%C3%A9goire.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Sage%20-%20Opa.mp3"
];

// 🔓 FIX IPHONE
let audioUnlocked = false;

let angle = 0;

let items = [
"Drague","Drama","Spicy","Imitation",
"Jalousie","Compliment","Mini drama","Sujet gênant"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

function drawWheel(){
let arc = (2*Math.PI)/items.length;
ctx.clearRect(0,0,360,360);

for(let i=0;i<items.length;i++){
ctx.beginPath();
ctx.fillStyle = i%2 ? "#ff2e88" : "#660033";
ctx.moveTo(180,180);
ctx.arc(180,180,180,i*arc,(i+1)*arc);
ctx.fill();

ctx.fillStyle="white";
ctx.save();
ctx.translate(180,180);
ctx.rotate(i*arc+arc/2);
ctx.fillText(items[i],90,0);
ctx.restore();
}
}
drawWheel();

function playRandomMusic(){
let player = document.getElementById("musicPlayer");
let randomIndex = Math.floor(Math.random() * playlist.length);

player.pause();
player.currentTime = 0;
player.src = playlist[randomIndex];
player.play().catch(()=>{});
}

function spin(){

let player = document.getElementById("musicPlayer");

// 🔓 DÉBLOCAGE IPHONE
if(!audioUnlocked){
player.src = playlist[0];
player.play().catch(()=>{});
audioUnlocked = true;
}

playRandomMusic();

// 🎡 animation début
canvas.style.transform = "scale(1.1)";

let spinAngle = Math.random()*2000+2000;
let duration = 3000;
let start = null;

function animate(t){
if(!start) start = t;

let progress = t - start;
let ease = spinAngle*(1-progress/duration);

angle += ease * 0.0006;

ctx.save();
ctx.translate(180,180);
ctx.rotate(angle);
ctx.translate(-180,-180);
drawWheel();
ctx.restore();

// 💥 effet tremblement
canvas.style.transform = "scale(1.1) rotate("+(Math.random()*6-3)+"deg)";

if(progress < duration){
requestAnimationFrame(animate);
}else{
canvas.style.transform = "scale(1)";
showResult();
}
}

requestAnimationFrame(animate);
}

function showResult(){

let arc = (2*Math.PI)/items.length;
let normalizedAngle = angle % (2*Math.PI);
let index = Math.floor((items.length - (normalizedAngle/(2*Math.PI))*items.length)) % items.length;

let res = items[index];

// 💬 TEXTE
let resultDiv = document.getElementById("result");
resultDiv.innerText = "🔥 " + res;
resultDiv.style.opacity = "1";
resultDiv.style.transform = "scale(1.5)";

// 💥 FLASH
let flash = document.getElementById("flash");
flash.style.opacity = 1;
setTimeout(()=>flash.style.opacity=0,300);

// 💣 ZOOM
document.body.style.transform = "scale(1.08)";
setTimeout(()=>{
document.body.style.transform = "scale(1)";
},200);

// reset
setTimeout(()=>{
resultDiv.style.opacity = "0";
resultDiv.style.transform = "scale(0.8)";
},2500);
}

</script>

</body>
</html>
