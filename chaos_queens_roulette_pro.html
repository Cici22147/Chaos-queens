<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chaos Queens 💜</title>

<style>
body{
margin:0;
background: radial-gradient(circle,#0d0010,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
color:#ff4dff;
margin-top:20px;
text-shadow:0 0 20px #cc00ff,0 0 50px #ff00ff;
}

/* 🔻 flèche fixe */
#pointer{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:60px;
color:#ff00ff;
text-shadow:0 0 20px #ff00ff,0 0 60px #cc00ff;
z-index:9999;
}

#wrapper{
position:relative;
width:420px;
margin:80px auto;
}

canvas{
width:420px;
height:420px;
border-radius:50%;
box-shadow:0 0 60px #cc00ff;
}

/* bouton glossy */
button{
padding:15px 30px;
margin-top:20px;
border:none;
border-radius:25px;
background:linear-gradient(145deg,#ff00ff,#9900ff);
color:white;
font-size:18px;
box-shadow:0 0 20px #ff00ff;
}
</style>
</head>

<body>

<h1>💜 CHAOS QUEENS 💜</h1>

<div id="pointer">🔻</div>

<div id="wrapper">
<canvas id="wheel" width="420" height="420"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<audio id="musicPlayer"></audio>

<script>

let playlist = [
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Twinsizz%20-%20Gr%C3%A9goire.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Sage%20-%20Opa.mp3"
];

let audioUnlocked=false;
let lastPlayed=-1;
let angle=0;

// 💜 couleurs glossy violet
let items=[
{text:"Drague",color:"#ff4dff"},
{text:"Drama",color:"#cc00ff"},
{text:"Spicy",color:"#ff00cc"},
{text:"Imitation",color:"#9900ff"},
{text:"Jalousie",color:"#b300ff"},
{text:"Compliment",color:"#ff80ff"},
{text:"Mini drama",color:"#e600e6"},
{text:"Sujet gênant",color:"#660066"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function drawWheel(){
let arc=(2*Math.PI)/items.length;
ctx.clearRect(0,0,420,420);

for(let i=0;i<items.length;i++){

let start=i*arc;
let end=(i+1)*arc;

// 🎨 base
ctx.beginPath();
ctx.moveTo(210,210);
ctx.arc(210,210,210,start,end);
ctx.closePath();

// 🌈 dégradé glossy
let grad = ctx.createRadialGradient(210,210,50,210,210,210);
grad.addColorStop(0,"#ffffff22"); // reflet centre
grad.addColorStop(0.3,items[i].color);
grad.addColorStop(1,"#000000");

ctx.fillStyle = grad;

// ✨ glow néon
ctx.shadowColor = items[i].color;
ctx.shadowBlur = 30;

ctx.fill();

// 💎 effet reflet glossy (haut)
ctx.beginPath();
ctx.moveTo(210,210);
ctx.arc(210,210,210,start,start+arc/2);
ctx.closePath();

let gloss = ctx.createLinearGradient(0,0,0,420);
gloss.addColorStop(0,"rgba(255,255,255,0.25)");
gloss.addColorStop(1,"rgba(255,255,255,0)");

ctx.fillStyle = gloss;
ctx.fill();

// 📝 texte
ctx.shadowBlur = 0;
ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.save();
ctx.translate(210,210);
ctx.rotate(start+arc/2);
ctx.fillText(items[i].text,120,0);
ctx.restore();
}
}
drawWheel();

function playRandomMusic(){
let player=document.getElementById("musicPlayer");

let randomIndex;
do{
randomIndex=Math.floor(Math.random()*playlist.length);
}while(randomIndex===lastPlayed);

lastPlayed=randomIndex;

player.pause();
player.currentTime=0;
player.src=playlist[randomIndex];

setTimeout(()=>player.play().catch(()=>{}),100);
}

function spin(){

let player=document.getElementById("musicPlayer");

if(!audioUnlocked){
player.src=playlist[0];
player.play().catch(()=>{});
audioUnlocked=true;
}

playRandomMusic();

let spinAngle=Math.random()*2000+2000;
let duration=3000;
let start=null;

function animate(t){
if(!start) start=t;

let progress=t-start;
let ease=spinAngle*(1-progress/duration);

angle+=ease*0.0006;

ctx.save();
ctx.translate(210,210);
ctx.rotate(angle);
ctx.translate(-210,-210);
drawWheel();
ctx.restore();

if(progress<duration){
requestAnimationFrame(animate);
}
}

requestAnimationFrame(animate);
}

</script>

</body>
</html>
