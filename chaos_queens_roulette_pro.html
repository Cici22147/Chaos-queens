<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>La Mafia Roulette 💓⚡️</title>

<style>
body{
margin:0;
background: radial-gradient(circle,#1a0015,#000);
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

/* 💓 titre */
h1{
color:#ff4da6;
margin-top:20px;
font-size:30px;
text-shadow:0 0 20px #ff2e88;
}

/* 🔻 flèche */
#pointer{
position:absolute;
top:-25px;
left:50%;
transform:translateX(-50%);
font-size:60px;
color:#ff2e88;
text-shadow:0 0 20px #ff2e88;
z-index:10;
}

/* 🎡 wrapper */
#wrapper{
position:relative;
width:420px;
margin:80px auto;
}

/* 🎡 roue */
canvas{
width:420px;
height:420px;
border-radius:50%;
box-shadow:0 0 40px #ff2e88;
}

/* bouton */
button{
padding:15px 30px;
margin-top:20px;
border:none;
border-radius:20px;
background:linear-gradient(45deg,#ff2e88,#ff0033);
color:white;
font-size:18px;
box-shadow:0 0 25px #ff2e88;
}
</style>
</head>

<body>

<h1>💓⚡️ LA MAFIA ROULETTE ⚡️💓</h1>

<div id="wrapper">
<div id="pointer">🔻</div>
<canvas id="wheel" width="420" height="420"></canvas>
</div>

<button onclick="spin()">LANCER 🔥</button>

<audio id="musicPlayer"></audio>

<script>

// 🎵 PLAYLIST COMPLETE
let playlist = [
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Twinsizz%20-%20Gr%C3%A9goire.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Kenjox%20%26%20Natoxie%20Ft%20Sage%20-%20Opa.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/S%C3%A9%20Miimii%20-%20Miimii%20KDS%20%26%20Dj%20Skycee%20(Paroles%20Lyrics).mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Meryl%20x%20Danthology%20-%20EDF%20Riddim%20remix.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Doja%20Cat%20-%20Streets%20(Official%20Audio).mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Needed%20Me.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Cassie%20-%20Long%20Way%202%20Go.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Mario%20-%20Let%20Me%20Love%20You%20(Lyrics).mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Tyla%20-%20CHANEL%20(Lyrics).mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Rihanna%20-%20Work%20ft.%20Drake.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Tyla%20-%20Water.mp3",
"https://raw.githubusercontent.com/Cici22147/Chaos-queens/main/Chris%20Brown%20-%20Under%20The%20Influence%20(Lyrics).mp3"
];

let audioUnlocked = false;
let lastPlayed = -1;
let angle = 0;

// 🎨 couleurs cohérentes (pas violet)
let items=[
{text:"Drague",color:"#ff2e88"},
{text:"Drama",color:"#ff0033"},
{text:"Spicy",color:"#ff1a4d"},
{text:"Imitation",color:"#cc0044"},
{text:"Jalousie",color:"#990033"},
{text:"Compliment",color:"#ff6699"},
{text:"Mini drama",color:"#ff3366"},
{text:"Sujet gênant",color:"#330000"}
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

function drawWheel(){
let arc=(2*Math.PI)/items.length;
ctx.clearRect(0,0,420,420);

for(let i=0;i<items.length;i++){

ctx.beginPath();
ctx.fillStyle=items[i].color;
ctx.moveTo(210,210);
ctx.arc(210,210,210,i*arc,(i+1)*arc);
ctx.fill();

// glow
ctx.shadowColor=items[i].color;
ctx.shadowBlur=15;
ctx.fill();

// texte
ctx.shadowBlur=0;
ctx.fillStyle="white";
ctx.font="bold 15px Arial";

ctx.save();
ctx.translate(210,210);
ctx.rotate(i*arc+arc/2);
ctx.fillText(items[i].text,120,0);
ctx.restore();
}
}
drawWheel();

function playRandomMusic(){
let player=document.getElementById("musicPlayer");

let randomIndex;
do{
randomIndex = Math.floor(Math.random()*playlist.length);
}while(randomIndex === lastPlayed);

lastPlayed = randomIndex;

player.pause();
player.currentTime = 0;
player.src = playlist[randomIndex];

setTimeout(()=>player.play().catch(()=>{}),100);
}

function spin(){

let player=document.getElementById("musicPlayer");

// 🔓 iPhone fix
if(!audioUnlocked){
player.src = playlist[0];
player.play().catch(()=>{});
audioUnlocked = true;
}

playRandomMusic();

let spinAngle=Math.random()*2000+2000;
let duration=3000;
let start=null;

function animate(t){
if(!start) start=t;

let progress=t-start;
let ease=spinAngle*(1-progress/duration);

angle += ease*0.0006;

ctx.save();
ctx.translate(210,210);
ctx.rotate(angle);
ctx.translate(-210,-210);
drawWheel();
ctx.restore();

if(progress<duration){
requestAnimationFrame(animate);
}
}

requestAnimationFrame(animate);
}

</script>

</body>
</html>
